[build-system]
requires = ["scikit-build-core"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
cmake.source-dir = "native"
wheel.packages = ["src/crashs"]

[tool.scikit-build.cmake.define]
# No default here: CMake is invoked from a temp build directory, so a relative default
# would resolve against the wrong working directory. CIBW_ENVIRONMENT sets this to an
# absolute path in CI; for a local `pip install .` leave it unset and CMakeLists.txt
# falls back to `${CMAKE_CURRENT_SOURCE_DIR}/build` (i.e. native/build), which is
# always correct relative to the actual source tree.
CBSTOOLS_NATIVE_BUILD_DIR = {env = "CBSTOOLS_NATIVE_BUILD_DIR", default = ""}

[project]
name = "crashs"
version = "0.3.0-alpha.1"
authors = [
  { name="Paul Yushkevich", email="pyushkevich@gmail.com" },
]
description = "CRASHS: Cortical Reconstruction for Automated Segmentation of Hippocampal Subfields (ASHS)"
dependencies = [
  'numpy',
  'torch>=2.0',
  'pykeops',
  'pymeshlab',
  'vtk==9.3.1',
  'SimpleITK',
  'geomloss',
  'statsmodels',
  'monai',
  'picsl_c3d>=1.4.2.1',
  'picsl_greedy>=0.0.5',
  'picsl_cmrep>=1.0.4.0',
  'nnunetv2>=2.3.1',
  'acvl_utils==0.2',
  'blosc2',
  'python-gdcm==3.0.23.1',
  'huggingface_hub==0.36.0'
]
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Development Status :: 4 - Beta",
    "Topic :: Scientific/Engineering :: Medical Science Apps."
]

[project.urls]
Homepage = "https://github.com/pyushkevich/crashs"
